services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carga360}
      POSTGRES_USER: ${POSTGRES_USER:-carga360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carga360}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://carga360:change-this-db-password@db:5432/carga360}
      C360_API_KEY: ${C360_API_KEY:-change-me-now}
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on: [api]
volumes:
  pgdata:
