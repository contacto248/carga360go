<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carga360GO Control Tower</title><style>body{font-family:system-ui;background:#07111f;color:#eaf4ff;margin:0}header{padding:26px 5%;background:linear-gradient(90deg,#07111f,#0b2841)}h1{margin:0;color:#45e0c2}.wrap{padding:24px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#0d1d2d;border:1px solid #1e3c53;border-radius:16px;padding:18px}.n{font-size:34px;font-weight:800}.muted{color:#8eb1c9}button{background:#45e0c2;border:0;padding:10px 14px;border-radius:10px;font-weight:700}input{background:#07111f;color:white;border:1px solid #31536a;padding:10px;border-radius:8px;width:280px}pre{white-space:pre-wrap;background:#06101a;padding:14px;border-radius:12px;min-height:80px}</style></head><body><header><h1>CARGA360GO · AI CONTROL TOWER</h1><div class="muted">Operaciones · agentes · aprobaciones · trazabilidad</div></header><main class="wrap"><p>API key <input id="k" value="change-me-now"> <button onclick="load()">Actualizar</button></p><section class="grid" id="stats"></section><h2>Agentes AI</h2><section class="grid" id="agents"></section><h2>Estado del sistema</h2><pre id="out">Listo.</pre></main><script>const H=()=>({'X-API-Key':document.querySelector('#k').value});async function api(p){let r=await fetch('/api'+p,{headers:H()});if(!r.ok)throw new Error(await r.text());return r.json()}async function load(){try{let [o,a]=await Promise.all([api('/overview'),api('/agents')]);stats.innerHTML=Object.entries(o).map(([k,v])=>`<div class=card><div class=n>${v}</div><div class=muted>${k}</div></div>`).join('');agents.innerHTML=Object.entries(a).map(([k,v])=>`<div class=card><b>${k}</b><div class=muted>${v.tools.join(' · ')}</div></div>`).join('');out.textContent='Sistema conectado · '+new Date().toLocaleString()}catch(e){out.textContent='Error: '+e.message}}load()</script></body></html>
