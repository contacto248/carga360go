# Sitio de Carga360go. Instalar como /etc/nginx/conf.d/carga360go.conf
# Certbot agrega el bloque 443 y la redirección a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name carga360go.cl www.carga360go.cl;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # microphone=(self): Agente Carga360go (Web Speech). HSTS lo emite Next en producción (HTTPS).
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
