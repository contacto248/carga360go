# CI sin secretos ni deploy. Repo privado: minutos Linux de GitHub Free.
# No configura billing; no debe generar cargo por exceso.

name: CI

on:
  pull_request:
    branches:
      - main
      - "fix/**"
      - "release/**"
      - "cursor/**"
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"
      - "cursor/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Paths fijos en /tmp (evitar contexto runner en env de job: failure con 0 jobs).
      DATABASE_PATH: /tmp/carga360go-ci/carga360go.sqlite
      UPLOAD_DIR: /tmp/carga360go-ci/uploads
      MAIL_OUTBOX: /tmp/carga360go-ci/mail
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare local dirs
        run: mkdir -p /tmp/carga360go-ci/uploads /tmp/carga360go-ci/mail

      - name: npm ci
        run: |
          set -euo pipefail
          if ! npm ci; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 make g++
            npm ci
          fi

      - name: test
        run: npm test

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: npm audit (prod)
        # Informativo: highs conocidos (p.ej. postcss/sharp) no bloquean el gate.
        continue-on-error: true
        run: npm audit --omit=dev
