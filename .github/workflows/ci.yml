# Este job se queda en los minutos Linux de GitHub Free (repo privado: 2.000 min/mes).
# El límite de gasto de Actions debe seguir en $0 (GitHub → Settings → Billing);
# el workflow no puede fijarlo y no debe poder generar un cargo por exceso.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders locales para que `next build` compile sin secretos ni APIs de pago.
      DATABASE_PATH: ${{ runner.temp }}/carga360go.sqlite
      UPLOAD_DIR: ${{ runner.temp }}/uploads
      MAIL_OUTBOX: ${{ runner.temp }}/mail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: |
          set -euo pipefail
          if ! npm ci; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 make g++
            npm ci
          fi

      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
