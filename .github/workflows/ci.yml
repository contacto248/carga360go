# CI sin secretos ni deploy. Repo privado: minutos Linux de GitHub Free.
# No configura billing; no debe generar cargo por exceso.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "fix/**"
      - "cursor/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders locales para que next build compile sin secretos ni APIs de pago.
      DATABASE_PATH: ${{ runner.temp }}/carga360go.sqlite
      UPLOAD_DIR: ${{ runner.temp }}/uploads
      MAIL_OUTBOX: ${{ runner.temp }}/mail
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: |
          set -euo pipefail
          if ! npm ci; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 make g++
            npm ci
          fi

      - name: test
        run: npm test

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: npm audit (prod)
        run: npm audit --omit=dev
